<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThinkPasser · AI 会员订阅</title>
<style>
  :root {
    --brand: #5b4cf0;
    --brand-2: #8b5cf6;
    --brand-soft: #efedff;
    --text: #1d1b2f;
    --muted: #6b6880;
    --line: #e8e6f0;
    --bg: #f6f5fb;
    --card: #ffffff;
    --accent: #ff6b3d;
    --ok: #16a34a;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  /* 顶部导航 */
  header { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .nav { display: flex; align-items: center; gap: 28px; height: 64px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; }
  .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; display: grid; place-items: center; font-size: 15px; }
  .nav-links { display: flex; gap: 22px; color: var(--muted); font-size: 15px; }
  .nav-links a:hover, .nav-links a.on { color: var(--brand); }
  .nav-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .btn { padding: 9px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .btn-ghost { background: transparent; color: var(--text); }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: #4a3bdc; }

  /* 首页横幅 */
  .hero { background: linear-gradient(120deg, #4f46e5, #7c3aed 60%, #a855f7); color: #fff; border-radius: 20px; margin: 24px 0; padding: 48px 44px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: center; overflow: hidden; }
  .hero h1 { font-size: 38px; line-height: 1.2; margin-bottom: 14px; }
  .hero p { opacity: .9; font-size: 16px; margin-bottom: 24px; }
  .hero .btn { background: #fff; color: var(--brand); padding: 12px 26px; font-size: 15px; }
  .hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 14px; padding: 16px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 13px; opacity: .85; }

  /* 信任条 */
  .trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .trust div { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
  .trust i { font-style: normal; font-size: 20px; }

  /* 分类 + 商品网格 */
  .section-head { display: flex; align-items: end; justify-content: space-between; margin-bottom: 14px; }
  .section-head h2 { font-size: 22px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab { padding: 7px 16px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .tab.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; transition: transform .15s, box-shadow .15s; cursor: pointer; position: relative; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(91,76,240,.12); }
  .card .tag { position: absolute; top: 14px; right: 14px; background: #fff1eb; color: var(--accent); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; }
  .card h3 { font-size: 17px; }
  .card .desc { color: var(--muted); font-size: 13px; min-height: 38px; }
  .card .model { font-size: 12px; color: var(--brand); background: var(--brand-soft); padding: 2px 8px; border-radius: 6px; align-self: flex-start; }
  .price-row { display: flex; align-items: baseline; gap: 6px; margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); }
  .price-row b { font-size: 22px; color: var(--accent); }
  .price-row s { color: #aaa; font-size: 13px; }
  .price-row small { color: var(--muted); font-size: 12px; }

  /* 详情页 */
  .crumb { color: var(--muted); font-size: 13px; margin: 20px 0 14px; }
  .crumb a { color: var(--brand); }
  .detail { display: grid; grid-template-columns: 1fr 420px; gap: 20px; margin-bottom: 40px; align-items: start; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  .d-head { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .d-head .icon { width: 68px; height: 68px; font-size: 34px; border-radius: 18px; }
  .d-head h1 { font-size: 24px; }
  .rating { color: #f59e0b; font-size: 14px; }
  .rating span { color: var(--muted); }
  .feat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 22px; }
  .feat div { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .feat div::before { content: "✓ "; color: var(--ok); font-weight: 700; }
  .panel h2 { font-size: 18px; margin: 6px 0 12px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
  .step { border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 13px; color: var(--muted); }
  .step b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  details { border-bottom: 1px solid var(--line); padding: 12px 0; }
  details summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  details p { color: var(--muted); font-size: 14px; margin-top: 8px; }

  .buy { position: sticky; top: 84px; }
  .buy h3 { font-size: 15px; margin-bottom: 10px; }
  .plans { display: grid; gap: 10px; margin-bottom: 18px; }
  .plan { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: #fff; text-align: left; }
  .plan.on { border-color: var(--brand); background: var(--brand-soft); }
  .plan .l b { display: block; font-size: 15px; }
  .plan .l small { color: var(--muted); font-size: 12px; }
  .plan .r { text-align: right; }
  .plan .r b { color: var(--accent); font-size: 18px; }
  .plan .r em { display: block; font-style: normal; font-size: 11px; color: #fff; background: var(--accent); border-radius: 4px; padding: 0 6px; margin-top: 2px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-top: 1px solid var(--line); margin-bottom: 12px; }
  .total b { font-size: 30px; color: var(--accent); }
  .buy .btn-primary { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; }
  .pay { display: flex; gap: 8px; justify-content: center; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .pay span { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .guarantee { margin-top: 14px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }

  /* 评价 + 页脚 */
  .reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }
  .review { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; font-size: 14px; }
  .review .who { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
  .review p { color: var(--muted); }
  footer { background: #1d1b2f; color: #b9b6cc; padding: 36px 0; font-size: 13px; }
  footer .cols { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 24px; }
  footer h4 { color: #fff; margin-bottom: 10px; font-size: 14px; }
  footer a { display: block; margin-bottom: 6px; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .hero { grid-template-columns: 1fr; padding: 32px 24px; }
    .hero h1 { font-size: 28px; }
    .trust { grid-template-columns: repeat(2, 1fr); }
    .detail { grid-template-columns: 1fr; }
    .buy { position: static; }
    .reviews { grid-template-columns: 1fr; }
    footer .cols { grid-template-columns: 1fr 1fr; }
    .nav-links { display: none; }
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .feat, .steps { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="#/"><span class="logo-mark">T</span>ThinkPasser</a>
    <nav class="nav-links">
      <a href="#/" class="on">首页</a>
      <a href="#/">全部会员</a>
      <a href="#/">邀请返利</a>
      <a href="#/">帮助中心</a>
    </nav>
    <div class="nav-right">
      <button class="btn btn-ghost" onclick="toast('登录功能开发中')">登录</button>
      <button class="btn btn-primary" onclick="toast('注册需要邀请码')">注册</button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap cols">
    <div>
      <div class="logo" style="color:#fff;margin-bottom:10px"><span class="logo-mark">T</span>ThinkPasser</div>
      <p>一张会员卡，用遍好用的 AI 助手。仅限受邀同学使用。</p>
    </div>
    <div><h4>产品</h4><a href="#/">编程助手</a><a href="#/">论文助手</a><a href="#/">通用对话</a></div>
    <div><h4>支持</h4><a href="#/">帮助中心</a><a href="#/">退款政策</a><a href="#/">联系我们</a></div>
    <div><h4>条款</h4><a href="#/">用户协议</a><a href="#/">隐私政策</a></div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
  // 原型数据：每个"会员"是 ThinkPasser 自己的服务，后台统一接国内模型
  const PRODUCTS = [
    { id: 'code', name: '编程助手 Pro', cat: '编程', icon: '💻', bg: '#e8f0ff', model: 'DeepSeek 驱动', desc: '写代码、讲作业、找 Bug，支持上传项目文件', tag: '热卖', base: 29.9,
      feats: ['每月 3000 次对话', '支持上传代码文件', '代码高亮与一键复制', '解题思路分步讲解'] },
    { id: 'paper', name: '论文助手', cat: '学习', icon: '📚', bg: '#fff4e5', model: 'Kimi 驱动', desc: '长文献阅读、摘要、润色，PDF 直接上传', tag: '新品', base: 24.9,
      feats: ['单次可读 20 万字', 'PDF / Word 上传', '中英文润色', '参考文献整理'] },
    { id: 'chat', name: '全能对话', cat: '通用', icon: '💬', bg: '#eafaf0', model: '通义千问驱动', desc: '日常问答、写作、头脑风暴，一个就够', base: 19.9,
      feats: ['每月 5000 次对话', '多轮上下文记忆', '历史记录云同步', '手机电脑通用'] },
    { id: 'english', name: '英语陪练', cat: '学习', icon: '🗣️', bg: '#fdeef4', model: '通义千问驱动', desc: '口语对练、作文批改、四六级备考', base: 19.9,
      feats: ['作文逐句批改', '四六级 / 雅思题型', '情景对话练习', '生词本自动整理'] },
    { id: 'all', name: '全家桶会员', cat: '通用', icon: '🎁', bg: '#efedff', model: '多模型自由切换', desc: '以上全部助手通用，额度共享，最划算', tag: '推荐', base: 49.9,
      feats: ['全部助手随意用', '每月 8000 次对话', '优先使用新功能', '专属客服群'] },
    { id: 'credit', name: '积分加油包', cat: '加油包', icon: '⚡', bg: '#fff1eb', model: '所有会员通用', desc: '额度不够？随时加量，永不过期', base: 9.9,
      feats: ['1000 次对话额度', '永久有效', '可叠加购买', '所有助手通用'] },
  ];
  // 时长套餐：月 / 季 / 年，越长越便宜
  const PLANS = [
    { id: 'm1', label: '月卡', months: 1, off: 1 },
    { id: 'm3', label: '季卡', months: 3, off: 0.9, badge: '9 折' },
    { id: 'm12', label: '年卡', months: 12, off: 0.75, badge: '省 25%' },
  ];
  const CATS = ['全部', '编程', '学习', '通用', '加油包'];
  const fmt = n => n.toFixed(1).replace(/\.0$/, '');
  let curCat = '全部';

  function card(p) {
    return `<div class="card" onclick="location.hash='#/p/${p.id}'">
      ${p.tag ? `<span class="tag">${p.tag}</span>` : ''}
      <div class="icon" style="background:${p.bg}">${p.icon}</div>
      <h3>${p.name}</h3>
      <span class="model">${p.model}</span>
      <p class="desc">${p.desc}</p>
      <div class="price-row"><b>¥${fmt(p.base * 0.75)}</b><small>/月起</small><s>¥${fmt(p.base)}</s></div>
    </div>`;
  }

  function home() {
    const list = PRODUCTS.filter(p => curCat === '全部' || p.cat === curCat);
    return `
    <section class="hero">
      <div>
        <h1>一张会员卡<br>用遍好用的 AI 助手</h1>
        <p>编程、论文、英语、日常对话，开通即用，不用折腾，不怕封号。</p>
        <button class="btn" onclick="location.hash='#/p/all'">立即开通 →</button>
      </div>
      <div class="hero-stats">
        <div class="stat"><b>¥14.9</b><span>每月起</span></div>
        <div class="stat"><b>秒开通</b><span>付款后自动到账</span></div>
        <div class="stat"><b>6 款</b><span>AI 助手可选</span></div>
        <div class="stat"><b>7 天</b><span>不满意可退款</span></div>
      </div>
    </section>
    <div class="trust">
      <div><i>⚡</i>付款即开通</div>
      <div><i>🔒</i>独立账号，数据私密</div>
      <div><i>💰</i>支付宝 / 微信支付</div>
      <div><i>🛟</i>7×12 小时客服</div>
    </div>
    <div class="section-head"><h2>全部会员</h2></div>
    <div class="tabs">${CATS.map(c => `<button class="tab ${c === curCat ? 'on' : ''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div>
    <div class="grid">${list.map(card).join('')}</div>
    <div class="section-head"><h2>同学们怎么说</h2></div>
    <div class="reviews">
      <div class="review"><div class="who">小王 · 计算机<span class="rating">★★★★★</span></div><p>写数据结构作业的时候特别好用，会一步步讲思路，不是直接甩答案。</p></div>
      <div class="review"><div class="who">Lily · 英语<span class="rating">★★★★★</span></div><p>作文批改很细，四六级备考帮了大忙，月卡价格学生党完全能接受。</p></div>
      <div class="review"><div class="who">阿杰 · 研一<span class="rating">★★★★☆</span></div><p>论文助手读英文文献很快，摘要准确，偶尔需要自己再核对一下。</p></div>
    </div>`;
  }

  let curPlan = 'm1';
  function detail(id) {
    const p = PRODUCTS.find(x => x.id === id);
    if (!p) return home();
    const isCredit = p.id === 'credit';
    const plans = isCredit ? [{ id: 'm1', label: '1 份', months: 1, off: 1 }] : PLANS;
    if (!plans.find(x => x.id === curPlan)) curPlan = plans[0].id;
    const sel = plans.find(x => x.id === curPlan);
    const total = p.base * sel.months * sel.off;
    return `
    <div class="crumb"><a href="#/">首页</a> / ${p.cat} / ${p.name}</div>
    <div class="detail">
      <div class="panel">
        <div class="d-head">
          <div class="icon" style="background:${p.bg}">${p.icon}</div>
          <div><h1>${p.name}</h1><div class="rating">★★★★★ <span>4.9 · 已有 1,280 位同学开通</span></div></div>
        </div>
        <span class="model">${p.model}</span>
        <p style="margin-top:12px;color:var(--muted)">${p.desc}</p>
        <div class="feat">${p.feats.map(f => `<div>${f}</div>`).join('')}</div>
        <h2>开通流程</h2>
        <div class="steps">
          <div class="step"><b>① 选套餐</b>按需选择月卡、季卡或年卡</div>
          <div class="step"><b>② 付款</b>支付宝 / 微信，秒级到账</div>
          <div class="step"><b>③ 直接用</b>登录 ThinkPasser 即可使用</div>
        </div>
        <h2>常见问题</h2>
        <details><summary>需要自己注册其他平台账号吗？</summary><p>不需要。开通后直接在 ThinkPasser 网站或手机浏览器里使用，所有助手都在这里。</p></details>
        <details><summary>额度用完了怎么办？</summary><p>可以购买积分加油包，或者升级到全家桶会员，额度立即生效。</p></details>
        <details><summary>可以退款吗？</summary><p>开通 7 天内，额度使用不超过 10% 可申请全额退款。</p></details>
        <details><summary>我的对话记录别人能看到吗？</summary><p>不能。每位同学都是独立账号，对话记录仅自己可见。</p></details>
      </div>
      <aside class="panel buy">
        <h3>选择套餐</h3>
        <div class="plans">
          ${plans.map(x => {
            const t = p.base * x.months * x.off;
            return `<button class="plan ${x.id === curPlan ? 'on' : ''}" onclick="setPlan('${x.id}','${p.id}')">
              <div class="l"><b>${x.label}</b><small>${isCredit ? '1000 次额度' : `¥${fmt(t / x.months)}/月`}</small></div>
              <div class="r"><b>¥${fmt(t)}</b>${x.badge ? `<em>${x.badge}</em>` : ''}</div>
            </button>`;
          }).join('')}
        </div>
        <div class="total"><span>应付金额</span><b>¥${fmt(total)}</b></div>
        <button class="btn btn-primary" onclick="toast('支付功能开发中：将跳转支付宝 / 微信')">立即开通</button>
        <div class="pay"><span>支付宝</span><span>微信支付</span></div>
        <div class="guarantee">
          <div>✓ 付款后自动开通，无需等待</div>
          <div>✓ 7 天无忧退款</div>
          <div>✓ 邀请同学开通，双方各得 500 积分</div>
        </div>
      </aside>
    </div>`;
  }

  function render() {
    const m = location.hash.match(/^#\/p\/(\w+)/);
    document.getElementById('app').innerHTML = m ? detail(m[1]) : home();
  }
  function setCat(c) { curCat = c; render(); }
  function setPlan(pl) { curPlan = pl; render(); }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
  }
  window.addEventListener('hashchange', () => { scrollTo(0, 0); render(); });
  render();
</script>
</body>
</html>
