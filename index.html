<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型平权 · AI 模型选型与开通</title>
<style>
  :root {
    --brand: #0ea5e9;
    --brand-d: #0284c7;
    --brand-2: #38bdf8;
    --brand-soft: #e0f2fe;
    --ink: #071a2e;
    --ink-2: #0d2a47;
    --text: #0c2340;
    --muted: #5b6b80;
    --line: #dbeaf5;
    --bg: #f4f9fd;
    --card: #ffffff;
    --ok: #16a34a;
    --warn: #d97706;
    --danger: #ef4444;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); line-height: 1.55; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  input, textarea, select { font: inherit; }
  code, .mono-t { font-family: var(--mono); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; width: 100%; }
  main { flex: 1; }

  /* 顶部导航 */
  header { background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .nav { display: flex; align-items: center; gap: 28px; height: 60px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; }
  .logo-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--brand-2); display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 700; }
  .nav-links { display: flex; gap: 22px; color: var(--muted); font-size: 14px; }
  .nav-links a:hover, .nav-links a.on { color: var(--brand-d); }
  .nav-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: background .15s, border-color .15s; }
  .btn-ghost:hover { color: var(--brand-d); }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-d); }
  .btn-line { border: 1px solid var(--line); background: #fff; }
  .btn-line:hover { border-color: var(--brand); color: var(--brand-d); }
  .btn-block { width: 100%; padding: 12px; font-size: 15px; }
  .menu-btn { display: none; font-size: 22px; }

  /* 通用 */
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .section { margin: 44px 0; }
  .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .section-head h2 { font-size: 22px; }
  .section-head p { color: var(--muted); font-size: 14px; }
  .section-head a { color: var(--brand-d); font-size: 14px; white-space: nowrap; }
  .eyebrow { font-family: var(--mono); font-size: 12px; color: var(--brand-d); letter-spacing: .5px; margin-bottom: 4px; }
  .crumb { color: var(--muted); font-size: 13px; margin: 20px 0 14px; font-family: var(--mono); }
  .crumb a { color: var(--brand-d); }
  .page-title { font-size: 26px; margin: 28px 0 6px; }
  .page-sub { color: var(--muted); margin-bottom: 22px; }
  .muted { color: var(--muted); }

  /* 首屏：深色终端风格 */
  .hero { position: relative; overflow: hidden; background: var(--ink); color: #e6f4ff; border-radius: 18px; margin: 24px 0 0; padding: 52px 44px; display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center;
    background-image: linear-gradient(rgba(56,189,248,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(56,189,248,.07) 1px, transparent 1px); background-size: 28px 28px; }
  .hero::after { content: ""; position: absolute; right: -120px; top: -120px; width: 380px; height: 380px; background: radial-gradient(circle, rgba(14,165,233,.35), transparent 70%); pointer-events: none; }
  .hero .eyebrow { color: var(--brand-2); }
  .hero h1 { font-size: 40px; line-height: 1.2; margin: 6px 0 16px; color: #fff; }
  .hero h1 em { font-style: normal; color: var(--brand-2); }
  .hero p { color: #9fb8cf; font-size: 16px; margin-bottom: 26px; max-width: 520px; }
  .hero .btn-primary { padding: 11px 22px; }
  .hero .btn-line { background: transparent; color: #e6f4ff; border-color: rgba(159,184,207,.4); padding: 11px 22px; margin-left: 8px; }
  .hero .btn-line:hover { border-color: var(--brand-2); color: var(--brand-2); }
  .term { position: relative; z-index: 1; background: #04111f; border: 1px solid rgba(56,189,248,.25); border-radius: 12px; font-family: var(--mono); font-size: 13px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .term-bar { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid rgba(56,189,248,.15); }
  .term-bar i { width: 10px; height: 10px; border-radius: 50%; background: #1e3a55; }
  .term-bar span { margin-left: 8px; color: #5f7d99; font-size: 12px; }
  .term pre { padding: 16px 18px; white-space: pre-wrap; color: #c6dcef; line-height: 1.7; min-height: 250px; }
  .term .c { color: #5f7d99; } .term .k { color: var(--brand-2); } .term .g { color: #4ade80; } .term .y { color: #fbbf24; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--brand-2); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 14px; background: #fff; margin-top: 16px; }
  .metrics div { padding: 16px 20px; border-right: 1px solid var(--line); }
  .metrics div:last-child { border-right: 0; }
  .metrics b { display: block; font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .metrics span { font-size: 13px; color: var(--muted); }

  /* 模型卡 */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab { padding: 6px 14px; border-radius: 8px; background: #fff; border: 1px solid var(--line); font-size: 13px; color: var(--muted); font-family: var(--mono); }
  .tab.on { background: var(--ink); border-color: var(--ink); color: var(--brand-2); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: border-color .15s, box-shadow .15s; }
  .card:hover { border-color: var(--brand-2); box-shadow: 0 8px 24px rgba(14,165,233,.12); }
  .card-top { display: flex; gap: 12px; align-items: center; }
  .logo-chip { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-family: var(--mono); font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .card h3 { font-size: 16px; line-height: 1.2; }
  .card .maker { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .card .desc { color: var(--muted); font-size: 13px; min-height: 40px; }
  .spec { font-family: var(--mono); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 5px; }
  .spec div { display: flex; justify-content: space-between; gap: 8px; }
  .spec span:first-child { color: var(--muted); }
  .spec span:last-child { text-align: right; }
  .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
  .card-actions .btn { padding: 8px 10px; font-size: 13px; }

  /* 免费 vs 付费 */
  .why { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .why-col { border-radius: 14px; padding: 22px; border: 1px solid var(--line); background: #fff; }
  .why-col.pro { border-color: var(--brand); background: linear-gradient(180deg, var(--brand-soft), #fff 60%); }
  .why-col h3 { font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .why-col ul { list-style: none; display: grid; gap: 9px; font-size: 14px; }
  .why-col li { display: flex; gap: 8px; }
  .why-col li::before { content: "—"; color: var(--muted); }
  .why-col.pro li::before { content: "+"; color: var(--brand-d); font-weight: 700; font-family: var(--mono); }
  .tagm { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--brand-2); }
  .roi { margin-top: 14px; background: var(--ink); color: #c6dcef; border-radius: 14px; padding: 20px 24px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
  .roi b { color: #fff; }
  .roi .calc { font-family: var(--mono); font-size: 13px; }
  .roi input { width: 64px; background: #04111f; border: 1px solid rgba(56,189,248,.35); color: var(--brand-2); border-radius: 6px; padding: 4px 8px; font-family: var(--mono); text-align: center; }
  .roi .out { font-family: var(--mono); font-size: 26px; color: #4ade80; text-align: right; }
  .roi .out small { display: block; font-size: 12px; color: #5f7d99; }

  /* 对比矩阵 */
  .matrix-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; font-family: var(--mono); background: #fafdff; }
  tr:last-child td { border-bottom: 0; }
  .dots { font-family: var(--mono); letter-spacing: 1px; color: var(--brand-d); }
  .dots s { color: #cfe3f2; text-decoration: none; }
  .yes { color: var(--ok); font-family: var(--mono); } .no { color: #b5c4d3; font-family: var(--mono); }
  td.hl, th.hl { background: var(--brand-soft); }

  /* 选型工具 */
  .advisor { max-width: 760px; margin: 0 auto 48px; }
  .progress { display: flex; gap: 6px; margin-bottom: 18px; }
  .progress i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
  .progress i.on { background: var(--brand); }
  .q h2 { font-size: 20px; margin-bottom: 4px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0; }
  .opt { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; text-align: left; background: #fff; }
  .opt:hover { border-color: var(--brand-2); }
  .opt.on { border-color: var(--brand); background: var(--brand-soft); }
  .opt b { display: block; font-size: 15px; }
  .opt small { color: var(--muted); font-size: 12px; }
  .result { display: grid; gap: 12px; }
  .rec { display: flex; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .rec.top { border-color: var(--brand); background: var(--brand-soft); }
  .rec .grow { flex: 1; }
  .rec .score { font-family: var(--mono); font-size: 20px; color: var(--brand-d); font-weight: 700; }

  /* 详情 */
  .detail { display: grid; grid-template-columns: 1fr 360px; gap: 20px; margin-bottom: 48px; align-items: start; }
  .d-head { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  .d-head .logo-chip { width: 60px; height: 60px; font-size: 22px; border-radius: 14px; }
  .d-head h1 { font-size: 24px; }
  .panel h2 { font-size: 17px; margin: 22px 0 10px; }
  .panel h2:first-child { margin-top: 0; }
  .kv { width: 100%; font-size: 14px; }
  .kv td { white-space: normal; padding: 10px 0; vertical-align: top; }
  .kv td:first-child { color: var(--muted); width: 120px; font-family: var(--mono); font-size: 12px; padding-top: 12px; }
  .uplift { display: grid; gap: 8px; }
  .uplift div { display: flex; gap: 10px; align-items: baseline; font-size: 14px; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .uplift div::before { content: "+"; font-family: var(--mono); color: var(--brand-d); font-weight: 700; }
  details { border-bottom: 1px solid var(--line); padding: 12px 0; }
  details summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  details p { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .side-box { position: sticky; top: 80px; }
  .side-box h3 { font-size: 14px; margin-bottom: 10px; font-family: var(--mono); color: var(--muted); font-weight: 600; }
  .plans { display: grid; gap: 8px; margin-bottom: 16px; }
  .plan { border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 14px; background: #fff; text-align: left; width: 100%; }
  .plan.on { border-color: var(--brand); background: var(--brand-soft); }
  .plan b { display: block; font-size: 15px; }
  .plan small { color: var(--muted); font-size: 12px; }
  .note { margin-top: 14px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
  .note div::before { content: "› "; color: var(--brand-d); font-family: var(--mono); }

  /* 表单 */
  .form-wrap { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-bottom: 48px; align-items: start; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; outline: none; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; font-weight: 600; background: #fff; }
  .seg button.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-d); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 12px 0; }
  .check a { color: var(--brand-d); }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  .summary-item { display: flex; gap: 12px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }

  /* 成功页 */
  .success { max-width: 560px; margin: 40px auto 48px; text-align: center; }
  .success .badge { width: 80px; height: 80px; border-radius: 50%; background: #dcfce7; color: var(--ok); display: grid; place-items: center; font-size: 42px; margin: 0 auto 16px; animation: pop .4s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 80% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
  .success h1 { font-size: 26px; margin-bottom: 6px; }
  .receipt { text-align: left; margin: 22px 0; font-family: var(--mono); font-size: 13px; background: var(--bg); border-radius: 10px; padding: 8px 16px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; }
  .row span:first-child { color: var(--muted); }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .next { text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; font-size: 14px; }
  .next ol { padding-left: 18px; color: var(--muted); margin-top: 6px; }
  .confetti { position: fixed; top: -10px; width: 7px; height: 12px; border-radius: 2px; z-index: 50; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .8; } }

  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; background: #fef3c7; color: #b45309; font-family: var(--mono); }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .big { font-size: 40px; margin-bottom: 8px; }

  /* 企业 / 帮助 / 文本页 */
  .biz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .biz .panel .eyebrow { margin-bottom: 8px; }
  .biz .panel b { display: block; font-size: 16px; margin-bottom: 4px; }
  .biz .panel p { color: var(--muted); font-size: 14px; }
  .help-cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
  .help-cats button { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: left; }
  .help-cats button.on { border-color: var(--brand); background: var(--brand-soft); }
  .doc { max-width: 820px; margin: 24px auto 48px; }
  .doc h2 { font-size: 17px; margin: 22px 0 8px; }
  .doc p { color: var(--muted); font-size: 15px; margin-bottom: 8px; }

  footer { background: var(--ink); color: #8aa6c0; padding: 36px 0 20px; font-size: 13px; }
  footer .cols { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 24px; }
  footer h4 { color: #fff; margin-bottom: 10px; font-size: 13px; font-family: var(--mono); }
  footer a { display: block; margin-bottom: 6px; }
  footer a:hover { color: var(--brand-2); }
  footer .copy { border-top: 1px solid rgba(255,255,255,.08); margin-top: 24px; padding-top: 16px; text-align: center; font-size: 12px; line-height: 1.8; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; }

  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .hero { grid-template-columns: 1fr; padding: 34px 22px; }
    .hero h1 { font-size: 30px; }
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .metrics div:nth-child(2) { border-right: 0; }
    .metrics div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .detail, .form-wrap, .why { grid-template-columns: 1fr; }
    .side-box { position: static; }
    .biz, .help-cats { grid-template-columns: 1fr; }
    .roi { grid-template-columns: 1fr; }
    .roi .out { text-align: left; }
    footer .cols { grid-template-columns: 1fr 1fr; }
    .nav-links { display: none; position: absolute; top: 60px; left: 0; right: 0; background: #fff; flex-direction: column; gap: 0; border-bottom: 1px solid var(--line); }
    .nav-links.open { display: flex; }
    .nav-links a { padding: 14px 16px; border-top: 1px solid var(--line); }
    .menu-btn { display: block; }
  }
  @media (max-width: 560px) {
    .grid, .two, .opts { grid-template-columns: 1fr; }
    .hero .btn-line { margin: 8px 0 0; }
    .nav-right .btn-ghost { display: none; }
  }
</style>
</head>
<body>

<header>

    <button class="menu-btn" onclick="$('#navLinks').classList.toggle('open')" aria-label="菜单">☰</button>

<script>
  // ========== 数据 ==========
  // 评分为编辑主观评估（1–5），用首字母色块代替官方 logo；价格以各官网为准，本站不展示
  const DIMS = [['write', '写作'], ['code', '编程'], ['long', '长文档'], ['search', '联网检索'], ['image', '图像生成'], ['office', '办公集成']];

        <h2>能力评估</h2>
        <table class="kv">${DIMS.map(([k, n]) => `<tr><td>${n}</td><td>${dots(p.score[k])}</td></tr>`).join('')}</table>
        <h2>付费版带来什么</h2>
        <div class="uplift">${p.uplift.map(u => `<div>${u}</div>`).join('')}</div>
        <h2>常见问题</h2>
        <details><summary>价格是多少？</summary><p>以 ${p.maker} 官网公布的价格为准。我们的选型和开通协助不收费，顾问会按你的用量建议最划算的版本。</p></details>
        <details><summary>账号归谁？</summary><p>在官方渠道以你本人或你公司的名义开通，账号和数据完全归你所有。</p></details>
        <details><summary>个人版、团队版、企业版怎么选？</summary><p>一个人用选个人版；需要统一付费和成员管理选团队版；需要 SSO、审计、合规和数据隔离选企业版。</p></details>
      </div>
      <aside class="panel side-box">
        <h3>// select_plan</h3>
        <div class="plans">${PLANS.map(x => `<button class="plan ${x.id === sel ? 'on' : ''}" onclick="curPlan['${p.id}']='${x.id}';render()"><b>${x.label}</b><small>${x.note}</small></button>`).join('')}</div>
        <a class="btn btn-primary btn-block" href="#/book/${p.id}/${sel}">预约开通</a>
        <a class="btn btn-line btn-block" style="margin-top:8px" href="#/compare">和其他模型对比</a>
        <div class="note"><div>选型与开通协助免费</div><div>价格以官网为准</div><div>官方渠道开通，账号归你</div></div>
      </aside>
    </div>`;
  }

  // ========== 预约 ==========
  let bookType = 'personal';
  function pageBook(id, planId) {
    const p = prod(id); if (!p) return page404();
    const pl = planOf(planId);
    bookType = pl.id === 'personal' ? 'personal' : 'company';
    return `
    <div class="crumb"><a href="#/models">models</a> / <a href="#/m/${p.id}">${p.id}</a> / book</div>
    <div class="form-wrap">
      <div class="panel">
        <h2 style="margin-top:0">预约开通</h2>
        <p class="muted" style="margin-bottom:18px;font-size:14px">提交后顾问会在 24 小时内联系你</p>
        <div class="field"><label>使用方</label>
          <div class="seg"><button id="t_personal" class="${bookType === 'personal' ? 'on' : ''}" onclick="setType('personal')">个人</button><button id="t_company" class="${bookType === 'company' ? 'on' : ''}" onclick="setType('company')">企业 / 团队</button></div>
        </div>
        <div class="two">
          <div class="field"><label>称呼 *</label><input id="f_name" placeholder="怎么称呼你"></div>
          <div class="field"><label>微信 / 电话 / 邮箱 *</label><input id="f_contact" placeholder="任填一种即可"></div>
        </div>
        <div class="two" id="companyFields" style="display:${bookType === 'company' ? 'grid' : 'none'}">
          <div class="field"><label>公司名称</label><input id="f_company" placeholder="选填"></div>
          <div class="field"><label>使用人数</label><select id="f_size"><option>2–10 人</option><option>11–50 人</option><option>51–200 人</option><option>200 人以上</option></select></div>
        </div>
        <div class="field"><label>版本</label><select id="f_plan">${PLANS.map(x => `<option value="${x.id}" ${x.id === pl.id ? 'selected' : ''}>${x.label}</option>`).join('')}</select></div>
        <div class="field"><label>使用场景</label><textarea id="f_note" rows="3" placeholder="例如：5 人前端团队，主要做 React 项目的代码审查"></textarea></div>
        <label class="check"><input type="checkbox" id="f_agree"> 我同意 <a href="#/doc/privacy">隐私政策</a>，并同意顾问通过我留下的方式联系我</label>
        <div class="err" id="f_err"></div>
        <button class="btn btn-primary btn-block" onclick="submitLead('${p.id}')">提交预约</button>
      </div>
      <aside class="panel side-box">
        <h3>// target</h3>
        <div class="summary-item">${chip(p)}<div><b>${p.name}</b><div class="muted mono-t" style="font-size:12px">${p.maker}</div></div></div>
        <div class="note" style="margin-top:0"><div>选型与开通协助免费</div><div>价格以官网为准</div><div>信息仅用于联系你，不会外泄</div></div>
      </aside>
    </div>`;
  }
  function setType(t) {
    bookType = t;
    $('#t_personal').classList.toggle('on', t === 'personal');
    $('#t_company').classList.toggle('on', t === 'company');
    $('#companyFields').style.display = t === 'company' ? 'grid' : 'none';
  }
  function submitLead(pid) {
    const name = $('#f_name').value.trim(), contact = $('#f_contact').value.trim();
    if (!name || !contact) { $('#f_err').textContent = '请填写称呼和联系方式'; return; }
    if (!$('#f_agree').checked) { $('#f_err').textContent = '请先勾选同意隐私政策'; return; }
    const lead = {
      id: 'MX-' + Date.now().toString(36).toUpperCase(),
      pid, plan: $('#f_plan').value, type: bookType, name, contact,
      company: bookType === 'company' ? $('#f_company').value.trim() : '', size: bookType === 'company' ? $('#f_size').value : '',
      note: $('#f_note').value.trim(), at: Date.now(),
    };
    // TODO: 接入线索后台（邮箱 / 表单服务 / 数据库）后，在这里把 lead 发出去
    S.leads.unshift(lead); save();
    go('#/done/' + lead.id);
  }
  function confetti() {
    const colors = ['#38bdf8', '#0ea5e9', '#0284c7', '#4ade80', '#fbbf24', '#e0f2fe'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('i');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
      c.style.animationDelay = Math.random() * .5 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4200);
    }
  }
  function pageDone(lid) {
    const l = S.leads.find(x => x.id === lid);
    if (!l) return page404();
    const p = prod(l.pid);
    setTimeout(confetti, 50);
    return `
    <div class="success panel">
      <div class="badge">✓</div>
      <h1>预约成功！</h1>
      <p class="muted">顾问将在 24 小时内联系你，协助开通 ${p.name}</p>
      <div class="receipt">
        <div class="row"><span>booking_id</span><span>${l.id}</span></div>
        <div class="row"><span>product</span><span>${p.name} · ${planOf(l.plan).label}</span></div>
        <div class="row"><span>name</span><span>${esc(l.name)}</span></div>
        <div class="row"><span>contact</span><span>${esc(l.contact)}</span></div>
        <div class="row"><span>created_at</span><span>${dateTime(l.at)}</span></div>
        <div class="row"><span>status</span><span style="color:var(--warn)">pending_contact</span></div>
      </div>
      <div class="next"><b>接下来</b><ol><li>顾问通过你留下的方式联系你，确认场景和人数</li><li>给出版本建议和预估费用</li><li>指导你在官方渠道完成开通与配置</li></ol></div>
      <div class="btn-row"><a class="btn btn-primary" href="#/models">继续看模型</a><a class="btn btn-line" href="#/mine">我的预约</a></div>
    </div>`;
  }
  function pageMine() {
    return `
    <div class="eyebrow" style="margin-top:28px">// BOOKINGS</div>
    <h1 class="page-title" style="margin-top:0">我的预约</h1>
    <p class="page-sub">在这台设备上提交过的预约记录</p>
    ${S.leads.length ? `<div class="matrix-wrap" style="margin-bottom:48px"><table>
        <tr><th>booking_id</th><th>product</th><th>created_at</th><th>status</th><th></th></tr>
        ${S.leads.map(l => `<tr><td class="mono-t">${l.id}</td><td>${prod(l.pid).name} · ${planOf(l.plan).label}</td><td class="mono-t">${dateTime(l.at)}</td><td><span class="pill">pending</span></td><td><a style="color:var(--brand-d)" href="#/done/${l.id}">详情</a></td></tr>`).join('')}
      </table></div>`
      : `<div class="panel empty" style="margin-bottom:48px"><div class="big">📋</div><p>还没有预约记录</p><a class="btn btn-primary" style="margin-top:12px" href="#/advisor">开始选型</a></div>`}`;
  }

  // ========== 企业 / 帮助 / 文本 ==========
  function pageBusiness() {
    return `
    <section class="hero" style="grid-template-columns:1fr">
      <div>
        <div class="eyebrow">// FOR TEAMS</div>
        <h1>让团队把 AI <em>用起来</em></h1>
        <p>选型评估、团队版 / 企业版开通、权限与 SSO 配置、场景化中文培训。按你们的技术栈和合规要求来。</p>
        <a class="btn btn-primary" href="#/book/chatgpt/enterprise">预约企业咨询 →</a><a class="btn btn-line" href="#/compare">查看对比矩阵</a>
      </div>
    </section>
    <section class="section">
      <div class="biz">
        <div class="panel"><div class="eyebrow">01 / ASSESS</div><b>选型评估</b><p>按岗位和工作流梳理需求，给出模型组合与预算建议。</p></div>
        <div class="panel"><div class="eyebrow">02 / DEPLOY</div><b>开通与配置</b><p>团队版 / 企业版开通、成员邀请、SSO 与权限配置。</p></div>
        <div class="panel"><div class="eyebrow">03 / ENABLE</div><b>中文培训</b><p>针对你们的真实业务场景，用中文培训到能独立使用。</p></div>
      </div>
    </section>
    <section class="section">
      <div class="section-head"><div><div class="eyebrow">// SUPPORTED</div><h2>支持团队 / 企业版的产品</h2></div></div>
      <div class="grid">${PRODUCTS.filter(p => p.team).map(card).join('')}</div>
    </section>`;
  }

  const HELP = {
    '选型': [['评分是怎么来的？', '由编辑基于公开资料和实际使用做出的主观评估，1–5 分，仅供参考。各产品更新很快，最终以你的实际试用为准。'], ['选型工具会推荐付费最贵的吗？', '不会。推荐只看任务匹配度、团队规模和生态，不看价格高低。']],
    '开通': [['价格是多少？', '以各产品官网公布的价格为准，我们的协助不收费。'], ['账号归谁？', '在官方渠道以你本人或你公司的名义开通，完全归你所有。'], ['需要准备什么？', '一个常用邮箱和可用的支付方式。企业版通常还需要公司域名。']],
    '关于本站': [['你们是官方吗？', '不是。我们是独立的中文服务平台，与所提及的品牌无隶属关系。'], ['你们怎么赚钱？', '部分链接为推广链接，用户开通时我们可能获得佣金，不会增加你的费用。'], ['我的信息安全吗？', '你留下的信息仅用于联系你，不会出售给第三方，详见隐私政策。']],
  };
  let helpCat = '选型';
  function pageHelp() {
    return `
    <div class="eyebrow" style="margin-top:28px">// FAQ</div>
    <h1 class="page-title" style="margin-top:0">帮助</h1>
    <p class="page-sub">常见问题</p>
    <div class="help-cats">${Object.keys(HELP).map(k => `<button class="${k === helpCat ? 'on' : ''}" onclick="helpCat='${k}';render()"><b>${k}</b></button>`).join('')}</div>
    <div class="panel" style="margin-bottom:48px">${HELP[helpCat].map(([q, a], i) => `<details ${i === 0 ? 'open' : ''}><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`;
  }

  const DOCS = {
    about: ['关于我们', [
      ['我们是谁', '模型平权是一个面向华人用户的独立 AI 选型与开通服务平台，帮助个人和企业搞清楚每款 AI 的能力边界，再决定为哪一款付费。'],
      ['我们的理念', '好模型值得付费，但前提是你清楚它能为你做什么。语言和信息差不该成为门槛。'],
    ]],
    privacy: ['隐私政策', [
      ['我们收集的信息', '你在预约表单中主动填写的称呼、联系方式、公司信息和使用场景。'],
      ['信息的用途', '仅用于联系你、了解需求并提供开通协助，不会出售或出租给第三方。'],
      ['查询与删除', '你可以随时联系我们，查询或删除你的信息。'],
    ]],
    disclaimer: ['免责声明', [
      ['独立平台', '本站为独立服务平台，与 OpenAI、Anthropic、Google、Microsoft 等所提及的任何公司均无隶属关系。所有产品名称和商标归各自所有者所有。'],
      ['推广链接', '部分链接为推广链接，用户通过这些链接开通服务时，我们可能获得佣金，不会增加你的费用。'],
      ['评分与信息', '能力评分为编辑主观评估；各产品的价格、功能与条款以其官网为准，本站信息仅供参考。'],
    ]],
  };
  function pageDoc(k) {
    const d = DOCS[k]; if (!d) return page404();
    return `<div class="doc panel"><div class="eyebrow">// DOCS</div><h1 class="page-title" style="margin-top:0">${d[0]}</h1><p class="muted mono-t" style="font-size:12px">updated 2026-10-22</p>
      ${d[1].map(([h, p]) => `<h2>${h}</h2><p>${p}</p>`).join('')}</div>`;
  }
  function page404() {
    return `<div class="empty" style="padding:80px 20px"><div class="big mono-t" style="color:var(--brand-d)">404</div><h2>页面不存在</h2><p style="margin:8px 0 16px">你访问的页面可能已被移动或删除</p><a class="btn btn-primary" href="#/">回到首页</a></div>`;
  }

  // ========== 路由 ==========
  function render() {
    const hash = location.hash.replace(/^#/, '') || '/';
    const [path, qs] = hash.split('?');
    const query = new URLSearchParams(qs || '');
    const seg = path.split('/').filter(Boolean);
    renderNav(path);
    let html;
    switch (seg[0]) {
      case undefined: html = pageHome(); break;
      case 'models': html = pageModels(query); break;
      case 'm': html = pageModel(seg[1]); break;
      case 'compare': html = pageCompare(); break;
      case 'advisor': html = pageAdvisor(); break;
      case 'book': html = pageBook(seg[1], seg[2]); break;
      case 'done': html = pageDone(seg[1]); break;
      case 'mine': html = pageMine(); break;
      case 'business': html = pageBusiness(); break;
      case 'help': html = pageHelp(); break;
      case 'doc': html = pageDoc(seg[1]); break;
      default: html = page404();
    }
    $('#app').innerHTML = html;
  }
  let lastPath = '';
  window.addEventListener('hashchange', () => {
    const p = location.hash.split('?')[0];
    if (p !== lastPath) scrollTo(0, 0);
    if (p === '#/advisor' && lastPath !== '#/advisor') { ans = {}; qi = 0; }
    lastPath = p;
    render();
  });
  render();
</script>
</body>
</html>
