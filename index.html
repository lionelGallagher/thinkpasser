<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThinkPasser · AI 会员订阅</title>
<style>
  :root {
    --brand: #0ea5e9;
    --brand-d: #0284c7;
    --brand-2: #38bdf8;
    --brand-soft: #e0f2fe;
    --text: #0c2340;
    --muted: #5b6b80;
    --line: #dbeaf5;
    --bg: #f0f9ff;
    --card: #ffffff;
    --accent: #f97316;
    --ok: #16a34a;
    --danger: #ef4444;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  input, textarea { font: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; width: 100%; }
  main { flex: 1; }

  /* 顶部导航 */
  header { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .nav { display: flex; align-items: center; gap: 28px; height: 64px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; }
  .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--brand-2), var(--brand-d)); color: #fff; display: grid; place-items: center; font-size: 15px; }
  .nav-links { display: flex; gap: 22px; color: var(--muted); font-size: 15px; }
  .nav-links a:hover, .nav-links a.on { color: var(--brand-d); }
  .nav-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; transition: background .15s; }
  .btn-ghost { color: var(--text); }
  .btn-ghost:hover { color: var(--brand-d); }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-d); }
  .btn-line { border: 1px solid var(--line); background: #fff; }
  .btn-line:hover { border-color: var(--brand); color: var(--brand-d); }
  .btn-block { width: 100%; padding: 13px; font-size: 16px; border-radius: 12px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--brand-2), var(--brand-d)); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .user-menu { position: relative; }
  .user-menu .drop { display: none; position: absolute; right: 0; top: 44px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 30px rgba(2,132,199,.12); padding: 6px; min-width: 160px; }
  .user-menu.open .drop { display: block; }
  .drop a, .drop button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; font-size: 14px; }
  .drop a:hover, .drop button:hover { background: var(--bg); color: var(--brand-d); }
  .menu-btn { display: none; font-size: 22px; }

  /* 通用块 */
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  .section-head { display: flex; align-items: end; justify-content: space-between; margin: 8px 0 14px; }
  .section-head h2 { font-size: 22px; }
  .section-head a { color: var(--brand-d); font-size: 14px; }
  .crumb { color: var(--muted); font-size: 13px; margin: 20px 0 14px; }
  .crumb a { color: var(--brand-d); }
  .page-title { font-size: 26px; margin: 24px 0 6px; }
  .page-sub { color: var(--muted); margin-bottom: 20px; }
  .muted { color: var(--muted); }

  /* 首页横幅 */
  .hero { background: linear-gradient(120deg, #38bdf8, #0ea5e9 55%, #0369a1); color: #fff; border-radius: 20px; margin: 24px 0; padding: 48px 44px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: center; }
  .hero h1 { font-size: 38px; line-height: 1.2; margin-bottom: 14px; }
  .hero p { opacity: .92; font-size: 16px; margin-bottom: 24px; }
  .hero .btn { background: #fff; color: var(--brand-d); padding: 12px 26px; font-size: 15px; }
  .hero .btn + .btn { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); margin-left: 8px; }
  .hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); border-radius: 14px; padding: 16px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 13px; opacity: .9; }
  .trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .trust div { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
  .trust i { font-style: normal; font-size: 20px; }

  /* 商品网格 */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab { padding: 7px 16px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .tab.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; transition: transform .15s, box-shadow .15s; position: relative; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(14,165,233,.15); }
  .card .tag { position: absolute; top: 14px; right: 14px; background: #fff1e6; color: var(--accent); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; flex-shrink: 0; }
  .card h3 { font-size: 17px; }
  .card .desc { color: var(--muted); font-size: 13px; min-height: 38px; }
  .model { font-size: 12px; color: var(--brand-d); background: var(--brand-soft); padding: 2px 8px; border-radius: 6px; align-self: flex-start; display: inline-block; }
  .price-row { display: flex; align-items: baseline; gap: 6px; margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); }
  .price-row b { font-size: 22px; color: var(--accent); }
  .price-row s { color: #9aa8b8; font-size: 13px; }
  .price-row small { color: var(--muted); font-size: 12px; }
  .card .btn { margin-top: 4px; }

  /* 详情页 */
  .detail { display: grid; grid-template-columns: 1fr 420px; gap: 20px; margin-bottom: 40px; align-items: start; }
  .d-head { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .d-head .icon { width: 68px; height: 68px; font-size: 34px; border-radius: 18px; }
  .d-head h1 { font-size: 24px; }
  .rating { color: #f59e0b; font-size: 14px; }
  .rating span { color: var(--muted); }
  .feat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 22px; }
  .feat div { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .feat div::before { content: "✓ "; color: var(--ok); font-weight: 700; }
  .panel h2 { font-size: 18px; margin: 6px 0 12px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
  .step { border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 13px; color: var(--muted); }
  .step b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  details { border-bottom: 1px solid var(--line); padding: 12px 0; }
  details summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  details p { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .buy { position: sticky; top: 84px; }
  .buy h3 { font-size: 15px; margin-bottom: 10px; }
  .plans { display: grid; gap: 10px; margin-bottom: 18px; }
  .plan { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; background: #fff; text-align: left; width: 100%; }
  .plan.on { border-color: var(--brand); background: var(--brand-soft); }
  .plan .l b { display: block; font-size: 15px; }
  .plan .l small { color: var(--muted); font-size: 12px; }
  .plan .r { text-align: right; }
  .plan .r b { color: var(--accent); font-size: 18px; }
  .plan .r em { display: block; font-style: normal; font-size: 11px; color: #fff; background: var(--accent); border-radius: 4px; padding: 0 6px; margin-top: 2px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-top: 1px solid var(--line); margin-bottom: 12px; }
  .total b { font-size: 30px; color: var(--accent); }
  .pay-icons { display: flex; gap: 8px; justify-content: center; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .pay-icons span { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .guarantee { margin-top: 14px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }

  /* 结算页 */
  .checkout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; margin-bottom: 40px; align-items: start; }
  .order-item { display: flex; gap: 14px; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .order-item .grow { flex: 1; }
  .paym { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .paym button { border: 2px solid var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 10px; align-items: center; font-weight: 600; background: #fff; }
  .paym button.on { border-color: var(--brand); background: var(--brand-soft); }
  .paym i { font-style: normal; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; outline: none; }
  .field input:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .inline { display: flex; gap: 8px; }
  .inline input { flex: 1; }
  .sum-row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; }
  .sum-row.disc { color: var(--ok); }
  .sum-row.big { font-size: 16px; font-weight: 700; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; }
  .sum-row.big b { color: var(--accent); font-size: 26px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 12px 0; }
  .check a { color: var(--brand-d); }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 4px; }

  /* 支付页 */
  .paybox { max-width: 460px; margin: 32px auto 48px; text-align: center; }
  .paybox .amount { font-size: 40px; font-weight: 800; color: var(--accent); margin: 8px 0; }
  .qr { width: 220px; height: 220px; margin: 18px auto; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #fff; position: relative; }
  .qr .mid { position: absolute; inset: 0; margin: auto; width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 800; border: 4px solid #fff; }
  .countdown { color: var(--muted); font-size: 13px; }
  .countdown b { color: var(--danger); }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 成功页 */
  .success { max-width: 560px; margin: 40px auto 48px; text-align: center; }
  .success .badge { width: 88px; height: 88px; border-radius: 50%; background: #dcfce7; color: var(--ok); display: grid; place-items: center; font-size: 46px; margin: 0 auto 16px; animation: pop .4s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 80% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
  .success h1 { font-size: 28px; margin-bottom: 6px; }
  .receipt { text-align: left; margin: 22px 0; }
  .receipt .sum-row span:first-child { color: var(--muted); }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .confetti { position: fixed; top: -10px; width: 8px; height: 14px; border-radius: 2px; z-index: 50; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .8; } }

  /* 登录注册 */
  .auth { max-width: 420px; margin: 40px auto 48px; }
  .auth h1 { font-size: 24px; margin-bottom: 4px; text-align: center; }
  .auth .page-sub { text-align: center; }
  .auth .switch { text-align: center; font-size: 14px; margin-top: 14px; color: var(--muted); }
  .auth .switch a { color: var(--brand-d); font-weight: 600; }

  /* 用户中心 */
  .account { display: grid; grid-template-columns: 220px 1fr; gap: 20px; margin: 24px 0 40px; align-items: start; }
  .side { padding: 12px; }
  .side .me { display: flex; gap: 10px; align-items: center; padding: 10px 8px 16px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .side a { display: block; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .side a.on, .side a:hover { background: var(--brand-soft); color: var(--brand-d); font-weight: 600; }
  .subs { display: grid; gap: 14px; }
  .sub { display: flex; gap: 16px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .sub .grow { flex: 1; }
  .bar { height: 8px; background: var(--brand-soft); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-2), var(--brand-d)); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .pill.ok { background: #dcfce7; color: var(--ok); }
  .pill.wait { background: #fef3c7; color: #b45309; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .big { font-size: 42px; margin-bottom: 8px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 14px; }
  .kpi b { display: block; font-size: 22px; }
  .kpi span { font-size: 13px; color: var(--muted); }
  .codebox { display: flex; gap: 8px; align-items: center; background: var(--brand-soft); border: 1px dashed var(--brand); border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 18px; letter-spacing: 2px; }
  .codebox span { flex: 1; }

  /* 对话页 */
  .chat { display: grid; grid-template-columns: 240px 1fr; gap: 0; height: calc(100vh - 64px - 48px); margin: 24px 0; background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .chat-side { border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; background: #fafdff; }
  .chat-side .bot { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 10px; font-size: 14px; width: 100%; text-align: left; }
  .chat-side .bot .icon { width: 34px; height: 34px; font-size: 17px; border-radius: 9px; }
  .chat-side .bot.on, .chat-side .bot:hover { background: var(--brand-soft); }
  .chat-side .bot small { display: block; color: var(--muted); font-size: 11px; }
  .chat-main { display: flex; flex-direction: column; min-width: 0; }
  .chat-top { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 76%; padding: 12px 14px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.me { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .suggest { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 10px; }
  .suggest button { border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font-size: 13px; color: var(--muted); background: #fff; }
  .suggest button:hover { border-color: var(--brand); color: var(--brand-d); }
  .composer { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; resize: none; height: 46px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; outline: none; }
  .composer textarea:focus { border-color: var(--brand); }
  .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; background: var(--muted); border-radius: 50%; animation: blink 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: .2; } }

  /* 帮助 / 文本页 */
  .help-cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .help-cats button { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; text-align: left; }
  .help-cats button.on { border-color: var(--brand); background: var(--brand-soft); }
  .help-cats b { display: block; margin-top: 6px; }
  .doc { max-width: 820px; margin: 0 auto 48px; }
  .doc h2 { font-size: 17px; margin: 22px 0 8px; }
  .doc p, .doc li { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
  .doc ul { padding-left: 20px; }
  .contact { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
  .contact div { background: var(--bg); border-radius: 12px; padding: 16px; text-align: center; }
  .contact b { display: block; margin: 6px 0 2px; }

  /* 评价 + 页脚 */
  .reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }
  .review { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; font-size: 14px; }
  .review .who { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
  .review p { color: var(--muted); }
  footer { background: #0c2340; color: #a9bfd6; padding: 36px 0 20px; font-size: 13px; }
  footer .cols { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 24px; }
  footer h4 { color: #fff; margin-bottom: 10px; font-size: 14px; }
  footer a { display: block; margin-bottom: 6px; }
  footer a:hover { color: #fff; }
  footer .copy { border-top: 1px solid rgba(255,255,255,.1); margin-top: 24px; padding-top: 16px; text-align: center; font-size: 12px; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; }

  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .hero { grid-template-columns: 1fr; padding: 32px 24px; }
    .hero h1 { font-size: 28px; }
    .trust, .help-cats { grid-template-columns: repeat(2, 1fr); }
    .detail, .checkout, .account { grid-template-columns: 1fr; }
    .buy { position: static; }
    .reviews, .contact { grid-template-columns: 1fr; }
    footer .cols { grid-template-columns: 1fr 1fr; }
    .nav-links { display: none; position: absolute; top: 64px; left: 0; right: 0; background: #fff; flex-direction: column; gap: 0; border-bottom: 1px solid var(--line); }
    .nav-links.open { display: flex; }
    .nav-links a { padding: 14px 16px; border-top: 1px solid var(--line); }
    .menu-btn { display: block; }
    .chat { grid-template-columns: 1fr; height: auto; }
    .chat-side { display: flex; gap: 6px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .chat-side .bot { width: auto; flex-shrink: 0; }
    .msgs { min-height: 50vh; }
  }
  @media (max-width: 520px) {
    .grid, .feat, .steps, .kpis { grid-template-columns: 1fr; }
    .paym { grid-template-columns: 1fr; }
    .hero .btn + .btn { margin: 8px 0 0; }
    th:nth-child(3), td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <button class="menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="菜单">☰</button>
    <a class="logo" href="#/"><span class="logo-mark">T</span>ThinkPasser</a>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-right" id="navRight"></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    <div class="cols">
      <div>
        <div class="logo" style="color:#fff;margin-bottom:10px"><span class="logo-mark">T</span>ThinkPasser</div>
        <p>一张会员卡，用遍好用的 AI 助手。</p>
      </div>

  function sendMsg(text) {

    const list = S.chats[chatBot] = S.chats[chatBot] || [];

    const box = $('#msgs');
    box.insertAdjacentHTML('beforeend', '<div class="msg ai typing" id="typing"><span></span><span></span><span></span></div>');

    }, 900 + Math.random() * 700);

    terms: ['用户协议', [
      ['服务说明', 'ThinkPasser 为注册用户提供 AI 对话会员服务。会员权益以购买页面展示为准。'],
      ['账号使用', '每个账号仅限本人使用，不得出借、转让或共享。'],
      ['使用规范', '不得利用本服务生成违法违规内容，不得用于学术不端行为。'],
      ['服务变更', '我们可能根据运营需要调整服务内容，重大变更会提前通知。'],
    ]],
    privacy: ['隐私政策', [
      ['我们收集的信息', '注册信息（昵称、邮箱或手机号）、订单信息、对话记录。'],
      ['信息的使用', '仅用于提供服务、处理订单和改进产品，不会出售给第三方。'],
      ['对话记录', '对话记录仅本人可见，你可以随时在对话页清空。'],
    ]],
    refund: ['退款政策', [
      ['适用条件', '开通 7 天内，且已用额度不超过 10%，可申请全额退款。'],
      ['不适用情形', '积分加油包一经使用不支持退款；因违规被封禁的账号不予退款。'],
      ['退款方式', '审核通过后 1–3 个工作日原路退回至支付账户。'],
    ]],
    contact: ['联系我们', null],
  };
  function pageDoc(k) {
    const d = DOCS[k]; if (!d) return page404();
    if (k === 'contact') return `
      <div class="doc"><h1 class="page-title">联系我们</h1><p class="page-sub">客服在线时间：每天 9:00 – 21:00</p>
        <div class="contact">
          <div><span style="font-size:26px">💬</span><b>在线客服</b><span class="muted">平均 3 分钟响应</span></div>
          <div><span style="font-size:26px">✉️</span><b>邮件支持</b><span class="muted">support@thinkpasser.com</span></div>
          <div><span style="font-size:26px">👥</span><b>同学交流群</b><span class="muted">开通会员后可加入</span></div>
        </div>
        <div class="panel"><h2>给我们留言</h2>
          <div class="field"><label>你的问题</label><textarea id="fb" rows="4" placeholder="描述一下遇到的问题"></textarea></div>
          <button class="btn btn-primary" onclick="if($('#fb').value.trim()){$('#fb').value='';toast('提交成功，我们会尽快回复你')}else toast('请先填写问题')">提交</button>
        </div></div>`;
    return `<div class="doc panel" style="margin-top:24px"><h1 class="page-title" style="margin-top:0">${d[0]}</h1><p class="muted">更新日期：2026-10-22</p>
      ${d[1].map(([h, p]) => `<h2>${h}</h2><p>${p}</p>`).join('')}</div>`;
  }

  function page404() {
    return `<div class="empty" style="padding:80px 20px"><div class="big">🧭</div><h2>页面不存在</h2><p style="margin:8px 0 16px">你访问的页面可能已被移动或删除</p><a class="btn btn-primary" href="#/">回到首页</a></div>`;
  }

  // ========== 路由 ==========
  function render() {
    const hash = location.hash.replace(/^#/, '') || '/';
    const [path, query] = hash.split('?');
    const seg = path.split('/').filter(Boolean);
    renderNav(path);
    let html;
    switch (seg[0]) {
      case undefined: html = pageHome(); break;
      case 'products': html = pageProducts(); break;
      case 'p': html = pageDetail(seg[1]); break;
      case 'checkout': html = pageCheckout(seg[1], seg[2]); break;
      case 'pay': html = pagePay(seg[1]); break;
      case 'success': html = pageSuccess(seg[1]); break;
      case 'login': html = pageLogin(); break;
      case 'register': html = pageRegister(); break;
      case 'forgot': html = pageForgot(); break;
      case 'account': html = pageAccount(seg[1]); break;
      case 'chat': html = pageChat(seg[1]); break;
      case 'invite': html = pageInvite(); break;
      case 'help': html = pageHelp(); break;
      case 'doc': html = pageDoc(seg[1]); break;
      default: html = page404();
    }
    $('#app').innerHTML = html;
    // 邀请链接带的邀请码自动填入
    const code = new URLSearchParams(query || '').get('code');
    if (code && $('#rg_code')) $('#rg_code').value = code;
    const box = $('#msgs'); if (box) box.scrollTop = box.scrollHeight;
  }
  let lastPath = '';
  window.addEventListener('hashchange', () => {
    const p = location.hash.split('?')[0];
    if (p !== lastPath) scrollTo(0, 0);
    lastPath = p;
    render();
  });
  render();
</script>
</body>
</html>
